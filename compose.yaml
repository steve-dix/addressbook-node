services:
  js-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: js-app:latest
    container_name: js-app
    ports:
      - "3000:3000"  # Application exposed at http://localhost:3000
    restart: unless-stopped
    init: true
    # env_file: ./.env  # Uncomment if .env file exists
    # No external service dependencies detected in README or source files
    # No volumes needed for persistence (not a database)
    # Uses non-root user as per Dockerfile
    # Application entrypoint: node addrbook.js

# No external services (database, cache, etc.) detected in documentation or code
# No volumes section needed
# No custom networks required (single service)
